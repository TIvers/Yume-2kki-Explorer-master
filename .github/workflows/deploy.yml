name: Deploy to production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yume2kki-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run compile

      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: browser-bundle
          path: |
            public/js/yume-2kki-explorer.js
            public/js/yume-2kki-explorer.js.map
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64
      - yume2kki-deploy
    timeout-minutes: 30
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Download browser bundle
        uses: actions/download-artifact@v4
        with:
          name: browser-bundle
          path: public/js

      - name: Update application files
        run: |
          rsync -a --no-owner --no-group \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/config/' \
            --exclude='/node_modules/' \
            --exclude='/public/images/' \
            --exclude='/venv/' \
            ./ /var/www/Yume-2kki-Explorer-master/

      - name: Install production dependencies and restart
        run: |
          set -euo pipefail
          cd /var/www/Yume-2kki-Explorer-master
          npm ci --omit=dev
          restart_service() {
            sudo -n /usr/bin/systemctl start yume2kki
          }
          sudo -n /usr/bin/systemctl stop yume2kki
          trap restart_service EXIT
          sudo -n /usr/bin/systemctl start yume2kki
          trap - EXIT
          /usr/bin/systemctl is-active --quiet yume2kki
